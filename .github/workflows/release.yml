name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  # tauri-action creates the release and uploads the installer.
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # A tag pushed by hand onto an unreleased commit names a version the files do
      # not carry; refuse it before spending a build on it.
      - name: The tag matches every version file
        shell: bash
        run: python docs/scripts/tool-release.py --check-tag "$GITHUB_REF_NAME"

      - name: Locate the changelog for this tag
        shell: bash
        run: |
          FILE="docs/CHANGELOG/${GITHUB_REF_NAME}.md"
          if [ ! -f "$FILE" ]; then
            echo "::error::$FILE is missing — every tag needs its changelog"
            exit 1
          fi
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.0

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The same gate CI runs: a tag can point at a commit CI never saw.
      - run: pnpm run typecheck
      - run: pnpm test

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Findex ${{ github.ref_name }}
          # A draft until the installer is attached: a failed build leaves an
          # invisible draft, never an empty public release.
          releaseDraft: true
          prerelease: false
          args: --config src-tauri/tauri.release.conf.json

      - name: Publish the release with its changelog
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "$GITHUB_REF_NAME" \
            --notes-file "docs/CHANGELOG/${GITHUB_REF_NAME}.md" \
            --draft=false --latest
