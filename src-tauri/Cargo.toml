[package]
name = "findex"
version = "0.1.0"
description = "A desktop launcher that finds files and folders by name, searches keywords inside file contents, tags folders, and opens results in a terminal or any app."
authors = ["dtbao"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

# main.rs only calls into the library, so tests link the app's code directly.
[lib]
name = "findex_lib"

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
rusqlite = { version = "0.40", features = ["bundled"] }
rayon = "1"
memchr = "2"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
# Markers of unfinished work, invisible in a GUI binary with no console.
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
# Production code returns AppError instead of panicking; clippy.toml exempts tests.
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
